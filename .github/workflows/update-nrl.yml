name: Update NRL tips

# SCHEDULING NOTES — read before changing the crons.
#
# GitHub runs scheduled workflows on a BEST-EFFORT queue. They are routinely
# delayed by hours and are sometimes dropped entirely, especially on the hour.
# Observed here: the 06:00-Sydney slot ran 3h44m late, and the noon slot never
# fired at all. So:
#   * never schedule on minute :00 — that's the most congested minute;
#   * don't rely on two slots a day. Run often and let the no-op path be cheap
#     (a full run is ~25s of runner time, and free on a public repo);
#   * running every 4h is also immune to the AEST/AEDT switch, which used to
#     drag the "6am" run to 7am for half the year.
#
# Current coverage (AEST, UTC+10 — shift one hour later in AEDT):
#   02:17, 06:17, 10:17, 14:17, 18:17, 22:17  +  05:47 daily  +  16:23 Tuesday.
# The Tuesday 16:23 slot exists because NRL team lists drop ~4pm Tuesday AEST;
# before it was added, the last run of the day was noon and the first look at
# team lists was Wednesday morning.

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours at :17
    - cron: "47 19 * * *"    # 05:47 Sydney — early-morning attempt
    - cron: "23 6 * * 2"     # 16:23 Sydney Tuesday — just after team lists drop
  workflow_dispatch: {}

concurrency:
  group: nrl-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Runners are UTC; the 6am-Sydney cron fires the previous UTC day, which
      # made date.today() stamp yesterday. Pin the whole job to Sydney time.
      TZ: Australia/Sydney
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # ODDS_API_KEY is a repo secret (Settings → Secrets and variables → Actions).
      # It is a NON-FATAL dependency on purpose: with no secret configured the fetch
      # logs why, skips The Odds API and falls back to nrl.com, and the run still
      # publishes a valid nrl_data.js with fixture.odds left null. Best-effort fields
      # never block a publish. Never echo this value — the repo is public, and
      # cloud_fetch.py redacts it from its own log lines for the same reason.
      - name: Fetch source pages
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python cloud_fetch.py

      # Weather was retired 2026-08-04 (audit): the model no longer reads it and
      # cloud_fetch.py no longer writes the dump. Delete the old committed copy
      # so `git add -A` stops re-carrying it — a leftover dump plus a leftover
      # --weather flag is how the feature could silently reanimate. rm -f is
      # idempotent: a no-op once the file is gone from the repo.
      - name: Retire the weather dump
        run: rm -f weather_dump.txt

      # --odds and --draw-meta are what make fixture.odds / venue / kick-off real.
      # They were missing from this line for months, which is the entire reason
      # the app said "Bookmaker odds drop around Tuesday" every day of the week
      # and showed "—" for every venue. If you edit this command, keep them.
      - name: Rebuild data from the fetched pages
        run: python parse_nrl.py --ladder ladder_dump.html --draw draw_dump.html --draw-meta draw_meta.json --odds odds_dump.txt --injuries injuries_dump.html --results results_dump.txt --out nrl_data.js --season 2026 --source zerotackle.com

      - name: Re-learn from the results memory
        run: python learn_model.py

      # Freeze the pre-kick-off tip for every upcoming game into nrl_tiplog.js by
      # running the REAL page headlessly (jsdom) — not a reimplementation, so it
      # can never drift from what users see. This is what makes full-time grading
      # identical on every device and immune to hindsight (docs/GOTCHAS.md,
      # 2026-08-02). Best-effort: a failure keeps the committed log and the run
      # continues — the front-end falls back to local snapshots + the lock rule.
      - name: Freeze pre-kick-off tips
        run: |
          npm install --no-save jsdom >/dev/null 2>&1 || true
          node freeze_tips.mjs || echo "tip freeze failed (non-fatal)"

      - name: Validate before publishing
        run: |
          python validate_data.py nrl_data.js
          python validate_learned.py nrl_learned.js

      - name: Build the hosted page
        run: cp nrl-tipping-guide.html index.html

      # A heartbeat that changes every run, so there is ALWAYS a commit when the
      # job runs. Without it, "no commit today" was ambiguous between "the cron
      # never fired" and "it fired but the data was identical" — which is exactly
      # what made the dropped-run problem invisible for so long.
      - name: Stamp the heartbeat
        run: |
          python - <<'PY'
          import datetime, json, re, pathlib, os, zoneinfo

          # Every pattern here is MULTILINE. The first version wasn't, so `^` only
          # matched at position 0 and every count came back 0 while the log showed
          # 524 players and 16 clubs — a broken health check is worse than none.
          def count(path, pattern):
              p = pathlib.Path(path)
              if not p.exists():
                  return 0
              return len(re.findall(pattern, p.read_text(encoding="utf-8", errors="ignore"),
                                    re.MULTILINE))

          def nrl_data_counters():
              """Read the generated nrl_data.js and count the fields the newer
              feeds fill in. Parsed properly rather than regex-counted, because a
              regex over a JS file is exactly how the counters above once all
              read 0 while the log said everything was fine."""
              blank = {"fixtures": 0, "fixturesWithOdds": 0, "fixturesWithKickoff": 0,
                       "fixturesWithTz": 0, "fixturesWithVenue": 0,
                       "changeEntries": 0, "changesSince": None, "dataRound": None}
              p = pathlib.Path("nrl_data.js")
              if not p.exists():
                  return blank
              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
                  body = "\n".join(l for l in text.splitlines() if not l.lstrip().startswith("//"))
                  data = json.loads(body.split("=", 1)[1].rsplit(";", 1)[0])
              except Exception:
                  return blank
              fx = data.get("fixtures") or []
              def priced(o):
                  if not isinstance(o, dict):
                      return False
                  use = o.get("close") or o.get("open") or o
                  return isinstance(use, dict) and isinstance(use.get("home"), (int, float)) \
                      and isinstance(use.get("away"), (int, float))
              return {
                  "fixtures": len(fx),
                  "fixturesWithOdds": sum(1 for f in fx if priced(f.get("odds"))),
                  "fixturesWithKickoff": sum(1 for f in fx if f.get("kickoff")),
                  "fixturesWithTz": sum(1 for f in fx if f.get("tz")),
                  "fixturesWithVenue": sum(1 for f in fx if f.get("venue")),
                  "changeEntries": len(data.get("changes") or []),
                  "changesSince": data.get("changesSince"),
                  "dataRound": data.get("round"),
              }

          def odds_api_status():
              """cloud_fetch.py's key-free sidecar on how the odds call went.
              oddsApiRemaining is the free tier's 500/month counter — watch it,
              because a quota that runs out mid-month silently freezes prices
              rather than failing the run."""
              blank = {"oddsApiState": None, "oddsApiRemaining": None, "oddsApiUsed": None,
                       "oddsApiHttp": None, "oddsApiBookQuotes": None}
              p = pathlib.Path("odds_api_status.json")
              if not p.exists():
                  return blank
              try:
                  d = json.loads(p.read_text(encoding="utf-8", errors="ignore"))
              except Exception:
                  return blank
              return {"oddsApiState": d.get("state"), "oddsApiRemaining": d.get("remaining"),
                      "oddsApiUsed": d.get("used"), "oddsApiHttp": d.get("httpStatus"),
                      "oddsApiBookQuotes": d.get("bookQuotes")}

          syd = datetime.datetime.now(zoneinfo.ZoneInfo("Australia/Sydney"))
          json.dump({
              "sydney": syd.strftime("%Y-%m-%d %H:%M:%S %Z"),
              "utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME", "?"),
              "runNumber": os.environ.get("GITHUB_RUN_NUMBER", "?"),
              # playersRated should be ~500 and playersRatedFullName should EQUAL it.
              # If they diverge, the ratings scrape has regressed to first-name keys
              # and injuries have silently stopped affecting tips.
              "playersRated": count("nrl_players.js", r'^\s*"[^"]+":\s*\{'),
              "playersRatedFullName": count("nrl_players.js", r'^\s*"[^"\s]+ [^"]+":\s*\{'),
              "clubsWithLineups": count("nrl_lineups.js", r'^\s*"[A-Z]{3}":'),
              "lineupRound": (re.search(r'"round":\s*(\d+)',
                              pathlib.Path("nrl_lineups.js").read_text(encoding="utf-8", errors="ignore"))
                              or [None, None])[1] if pathlib.Path("nrl_lineups.js").exists() else None,
              "clubsWithNews": count("injuries_dump.html", r"^[A-Z][^:\n]{3,40}:"),
              # --- the odds / venue / kick-off / change feeds -------------------
              # These exist for the same reason as the counters above: a scraper
              # that silently stops producing is invisible in a green run. If
              # fixturesWithOdds sits at 0 from Wednesday on, or fixturesWithKickoff
              # or fixturesWithTz is below fixtures, the odds/draw fetch has
              # regressed and the app is back to "odds drop around Tuesday".
              # oddsApiState "no-key"/"bad-key"/"quota-exhausted" tells you which.
              **nrl_data_counters(),
              **odds_api_status(),
          }, open("last_run.json", "w"), indent=2)
          PY
          cat last_run.json

      - name: Commit and publish
        run: |
          git config user.name "nrl-tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Auto update NRL data" || echo "nothing changed"
          git push

      # Silent failures are how a broken scraper survives for weeks. Shout.
      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "NRL update run failed";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "automation"
            });
            const body = `The scheduled NRL update failed.\n\nRun: ${url}\nTrigger: ${context.eventName}`;
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["automation"] });
            }
